<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Py7 — Тренажер Python (7 клас)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #283548;
      --editor-bg: #0b1120;
      --output-bg: #090e1a;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-ink: #022c22;
      --blue: #38bdf8;
      --turtle-bg: #0d2b2b;
      --turtle-border: #14b8a6;
      --turtle-text: #5eead4;
      --danger: #ef4444;
      --danger-bg: #2a1218;
      --danger-border: #f87171;
      --warn: #fbbf24;
      --mono: "JetBrains Mono", "Fira Code", "SF Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      max-width: 100vw;
      overflow: hidden;
      background: var(--bg);
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: var(--blue);
      flex-shrink: 0;
      user-select: none;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .view-switch {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 1;
      min-width: 0;
    }

    .view-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      min-height: 32px;
      transition: background-color 0.15s, color 0.15s;
    }

    .view-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .run-btn {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      padding: 0 12px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }

    .run-btn:active {
      transform: scale(0.97);
    }

    .run-btn.running {
      background: var(--danger);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1.15;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--editor-bg);
      position: relative;
    }

    .editor-textarea {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      background: var(--editor-bg);
      color: #e2e8f0;
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1.5;
      padding: 12px;
      tab-size: 4;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow-y: auto;
      overflow-x: hidden;
      caret-color: var(--accent);
    }

    .editor-textarea::placeholder {
      color: #475569;
    }

    .pane-divider {
      height: 4px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .output-pane {
      flex: 0.95;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--output-bg);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* View Modes */
    .app[data-view="code"] .output-pane,
    .app[data-view="code"] .pane-divider {
      display: none;
    }
    .app[data-view="code"] .editor-pane {
      flex: 1;
    }

    .app[data-view="result"] .editor-pane,
    .app[data-view="result"] .pane-divider,
    .app[data-view="result"] .toolbars {
      display: none;
    }
    .app[data-view="result"] .output-pane {
      flex: 1;
    }

    /* Interactive input() Bar */
    .input-bar {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #172554;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 10px;
      flex-shrink: 0;
    }

    .input-bar.visible {
      display: flex;
    }

    .input-prompt-label {
      font-size: 14px;
      font-weight: 600;
      color: #bfdbfe;
      word-break: break-word;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .stdin-field {
      flex: 1;
      min-width: 0;
      height: 42px;
      border-radius: 8px;
      border: 1px solid #60a5fa;
      background: #0f172a;
      color: #ffffff;
      font-family: var(--mono);
      font-size: 16px;
      padding: 0 10px;
      outline: none;
    }

    .stdin-submit {
      height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #ffffff;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    /* Ukrainian Error Card */
    .error-card {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      padding: 10px 12px;
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .error-card.visible {
      display: flex;
    }

    .error-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #fca5a5;
      font-weight: 700;
      font-size: 14px;
    }

    .error-line-badge {
      background: rgba(239, 68, 68, 0.25);
      color: #fecaca;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      flex-shrink: 0;
    }

    .error-what {
      color: #fee2e2;
    }

    .error-where {
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid var(--danger-border);
      padding: 6px 8px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 13px;
      color: #fecaca;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-fix {
      color: #fde68a;
      font-size: 13.5px;
    }

    /* Turtle Canvas */
    .turtle-wrap {
      display: none;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      min-height: 210px;
      height: 240px;
    }

    .app[data-view="result"] .turtle-wrap {
      height: 320px;
      flex-shrink: 0;
    }

    .turtle-wrap.visible {
      display: flex;
    }

    #turtle-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .turtle-hud {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(15, 23, 42, 0.78);
      color: #e2e8f0;
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Console Text Output */
    .console-out {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 36px;
    }

    .console-placeholder {
      color: #64748b;
      font-family: var(--sans);
      font-size: 13px;
    }

    .console-input-echo {
      color: #93c5fd;
    }

    /* Bottom Toolbars */
    .toolbars {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-top: 1px solid rgba(51, 65, 85, 0.55);
    }

    .toolbar-row:first-child {
      border-top: none;
    }

    .toolbar-row::-webkit-scrollbar {
      display: none;
    }

    .toolbar-row.turtle-bar {
      display: none;
      background: var(--turtle-bg);
      border-bottom: 1px solid rgba(20, 184, 166, 0.35);
    }

    .toolbar-row.turtle-bar.visible {
      display: flex;
    }

    .tb-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      height: 40px;
      min-width: 40px;
      padding: 0 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      white-space: nowrap;
      user-select: none;
      touch-action: pan-x manipulation;
    }

    .tb-btn:active {
      background: #3b4c66;
      transform: scale(0.96);
    }

    .tb-btn.kw {
      color: #7dd3fc;
      font-size: 13px;
    }

    .tb-btn.fn {
      color: #fde68a;
      font-size: 13px;
    }

    .tb-btn.turtle-cmd {
      background: rgba(20, 184, 166, 0.14);
      border-color: rgba(20, 184, 166, 0.45);
      color: var(--turtle-text);
      font-size: 13px;
    }

    .tb-btn.turtle-cmd:active {
      background: rgba(20, 184, 166, 0.3);
    }

    .turtle-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--turtle-text);
      padding-right: 4px;
      flex-shrink: 0;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="app" id="app" data-view="split">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Py7</span>
      </div>

      <div class="view-switch" role="tablist" aria-label="Режим екрана">
        <button type="button" class="view-btn active" data-mode="split">Розділений</button>
        <button type="button" class="view-btn" data-mode="code">Код</button>
        <button type="button" class="view-btn" data-mode="result">Результат</button>
      </div>

      <button type="button" class="run-btn" id="run-btn">▶ Запустити</button>
    </header>

    <main class="workspace">
      <section class="editor-pane">
        <textarea
          id="code-editor"
          class="editor-textarea"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="enter"
          placeholder="# Напиши код Python тут..."
        ></textarea>
      </section>

      <div class="pane-divider"></div>

      <section class="output-pane" id="output-pane" aria-live="polite">
        <div class="input-bar" id="input-bar">
          <div class="input-prompt-label" id="input-prompt-label">Введи значення:</div>
          <div class="input-row">
            <input
              type="text"
              id="stdin-input"
              class="stdin-field"
              autocapitalize="off"
              autocorrect="off"
              autocomplete="off"
              spellcheck="false"
              placeholder="Введіть відповідь..."
            />
            <button type="button" id="stdin-submit" class="stdin-submit">Ввести</button>
          </div>
        </div>

        <div class="error-card" id="error-card">
          <div class="error-head">
            <span id="error-title">Помилка у програмі</span>
            <span class="error-line-badge" id="error-line-badge">Рядок 1</span>
          </div>
          <div class="error-what" id="error-what"></div>
          <div class="error-where" id="error-where"></div>
          <div class="error-fix" id="error-fix"></div>
        </div>

        <div class="turtle-wrap" id="turtle-wrap">
          <canvas id="turtle-canvas"></canvas>
          <div class="turtle-hud" id="turtle-hud">x: 0, y: 0 | кут: 0°</div>
        </div>

        <div class="console-out" id="console-out">
          <span class="console-placeholder">Натисни «Запустити», щоб виконати програму.</span>
        </div>
      </section>
    </main>

    <footer class="toolbars" id="toolbars">
      <!-- Dynamic Turtle Toolbar (hidden unless turtle is imported) -->
      <div class="toolbar-row turtle-bar" id="turtle-bar" aria-label="Команди turtle">
        <span class="turtle-badge">🐢</span>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="shape">shape</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="width">width</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="color">color</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="forward">forward</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="left">left</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="right">right</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="goto">goto</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="begin_fill">begin_fill</button>
        <button type="button" class="tb-btn turtle-cmd" tabindex="-1" data-turtle="end_fill">end_fill</button>
      </div>

      <!-- Second Toolbar: Constructs & Built-in Functions -->
      <div class="toolbar-row" id="constructs-bar" aria-label="Конструкції Python">
        <button type="button" class="tb-btn fn" tabindex="-1" data-snippet="print">print</button>
        <button type="button" class="tb-btn fn" tabindex="-1" data-snippet="input">input</button>
        <button type="button" class="tb-btn fn" tabindex="-1" data-snippet="int">int</button>
        <button type="button" class="tb-btn fn" tabindex="-1" data-snippet="float">float</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="if">if</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="else">else</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="elif">elif</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="while">while</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="for_range">for i in range</button>
        <button type="button" class="tb-btn kw" tabindex="-1" data-snippet="def">def</button>
      </div>

      <!-- First Toolbar: Symbols & Operators -->
      <div class="toolbar-row" id="symbols-bar" aria-label="Символи та оператори">
        <button type="button" class="tb-btn" tabindex="-1" data-sym="(">(</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym=")">)</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym=":">:</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym=";">;</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="!">!</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="<">&lt;</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym=">">&gt;</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="=">=</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="+">+</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="-">-</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="*">*</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="/">/</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="//">//</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="%">%</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym='""'>""</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym=",">,</button>
        <button type="button" class="tb-btn" tabindex="-1" data-sym="    ">⇥</button>
      </div>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'py7_trainer_code_v1';
      const DEFAULT_CODE = 'name = "7 клас"\nprint("Привіт,", name)\n';

      const appEl = document.getElementById('app');
      const editor = document.getElementById('code-editor');
      const runBtn = document.getElementById('run-btn');
      const viewBtns = document.querySelectorAll('.view-btn');
      const outputPane = document.getElementById('output-pane');
      const consoleOut = document.getElementById('console-out');
      const errorCard = document.getElementById('error-card');
      const errorTitle = document.getElementById('error-title');
      const errorLineBadge = document.getElementById('error-line-badge');
      const errorWhat = document.getElementById('error-what');
      const errorWhere = document.getElementById('error-where');
      const errorFix = document.getElementById('error-fix');
      const inputBar = document.getElementById('input-bar');
      const inputPromptLabel = document.getElementById('input-prompt-label');
      const stdinInput = document.getElementById('stdin-input');
      const stdinSubmit = document.getElementById('stdin-submit');
      const turtleBar = document.getElementById('turtle-bar');
      const turtleWrap = document.getElementById('turtle-wrap');
      const turtleCanvas = document.getElementById('turtle-canvas');
      const turtleHud = document.getElementById('turtle-hud');

      // Sync viewport height when on-screen keyboard appears on mobile browsers
      function syncViewportHeight() {
        if (window.visualViewport) {
          appEl.style.height = window.visualViewport.height + 'px';
        }
        if (turtleWrap.classList.contains('visible')) {
          turtleEngine.render();
        }
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
      }
      window.addEventListener('resize', () => {
        if (turtleWrap.classList.contains('visible')) {
          turtleEngine.render();
        }
      });

      // Load saved code
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        editor.value = saved !== null ? saved : DEFAULT_CODE;
      } catch (_) {
        editor.value = DEFAULT_CODE;
      }

      function saveCode() {
        try {
          localStorage.setItem(STORAGE_KEY, editor.value);
        } catch (_) {}
      }

      // Detect turtle import in code
      function detectTurtleMode(code) {
        const lines = code.split(/\r?\n/);
        let active = false;
        let style = 'none'; // 'direct' | 'module' | 'alias'
        let alias = 'turtle';
        let instanceVar = null;

        for (const raw of lines) {
          const line = raw.replace(/#.*$/, '').trim();
          if (!line) continue;
          const mImportAs = line.match(/^import\s+turtle\s+as\s+([A-Za-z_]\w*)$/);
          if (mImportAs) {
            active = true;
            style = 'alias';
            alias = mImportAs[1];
            continue;
          }
          if (/^import\s+turtle\b/.test(line)) {
            active = true;
            if (style === 'none') {
              style = 'module';
              alias = 'turtle';
            }
            continue;
          }
          if (/^from\s+turtle\s+import\b/.test(line)) {
            active = true;
            style = 'direct';
            continue;
          }
          const mTurtleObj = line.match(/^([A-Za-z_]\w*)\s*=\s*(?:[A-Za-z_]\w*\.)?Turtle\s*\(/);
          if (mTurtleObj) {
            instanceVar = mTurtleObj[1];
          }
        }
        return { active, style, alias, instanceVar };
      }

      function updateTurtleToolbar() {
        const info = detectTurtleMode(editor.value);
        turtleBar.classList.toggle('visible', info.active);
      }
      updateTurtleToolbar();

      editor.addEventListener('input', () => {
        saveCode();
        updateTurtleToolbar();
      });

      // View Switcher
      function setViewMode(mode) {
        appEl.setAttribute('data-view', mode);
        viewBtns.forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
        if (mode !== 'code' && turtleWrap.classList.contains('visible')) {
          requestAnimationFrame(() => turtleEngine.render());
        }
      }

      viewBtns.forEach((btn) => {
        btn.addEventListener('click', () => setViewMode(btn.dataset.mode));
      });

      // Helper: Insert text at cursor preserving focus
      function getCurrentLineIndent() {
        const val = editor.value;
        const pos = editor.selectionStart || 0;
        const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
        const lineUpToCursor = val.slice(lineStart, pos);
        const m = lineUpToCursor.match(/^[ \t]*/);
        return m ? m[0].replace(/\t/g, '    ') : '';
      }

      function insertAtCursor(text, cursorOffsetFromInsertStart = text.length) {
        const start = editor.selectionStart ?? editor.value.length;
        const end = editor.selectionEnd ?? start;
        const before = editor.value.slice(0, start);
        const after = editor.value.slice(end);
        editor.value = before + text + after;
        const nextPos = start + cursorOffsetFromInsertStart;
        if (document.activeElement !== editor) {
          editor.focus({ preventScroll: true });
        }
        editor.setSelectionRange(nextPos, nextPos);
        saveCode();
        updateTurtleToolbar();
      }

      // Preserve focus without blocking horizontal scroll on touch
      document.getElementById('toolbars').addEventListener('mousedown', (e) => {
        if (e.target.closest('.tb-btn')) {
          e.preventDefault();
        }
      });

      // Handle Enter auto-indent & Tab
      let enterHandledByKeydown = false;

      function handleSmartEnter() {
        const pos = editor.selectionStart ?? editor.value.length;
        const val = editor.value;
        const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
        const lineBeforeCursor = val.slice(lineStart, pos);
        const baseIndentMatch = lineBeforeCursor.match(/^[ \t]*/);
        let indent = baseIndentMatch ? baseIndentMatch[0].replace(/\t/g, '    ') : '';
        const codePart = lineBeforeCursor.replace(/#.*$/, '').trimEnd();
        if (codePart.endsWith(':')) {
          indent += '    ';
        }
        insertAtCursor('\n' + indent, 1 + indent.length);
      }

      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          enterHandledByKeydown = true;
          handleSmartEnter();
          setTimeout(() => { enterHandledByKeydown = false; }, 0);
        } else if (e.key === 'Tab') {
          e.preventDefault();
          insertAtCursor('    ', 4);
        }
      });

      editor.addEventListener('beforeinput', (e) => {
        if (e.inputType === 'insertLineBreak' && !enterHandledByKeydown) {
          e.preventDefault();
          handleSmartEnter();
        }
      });

      // Symbol Toolbar clicks
      document.getElementById('symbols-bar').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-sym]');
        if (!btn) return;
        const sym = btn.dataset.sym;
        if (sym === '""') {
          insertAtCursor('""', 1);
        } else if (sym === '()') {
          insertAtCursor('()', 1);
        } else {
          insertAtCursor(sym, sym.length);
        }
      });

      // Constructs Toolbar clicks
      document.getElementById('constructs-bar').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-snippet]');
        if (!btn) return;
        const type = btn.dataset.snippet;
        const indent = getCurrentLineIndent();

        switch (type) {
          case 'print':
            insertAtCursor('print()', 6);
            break;
          case 'input':
            insertAtCursor('input()', 6);
            break;
          case 'int':
            insertAtCursor('int()', 4);
            break;
          case 'float':
            insertAtCursor('float()', 6);
            break;
          case 'if':
            insertAtCursor(`if :\n${indent}    `, 3);
            break;
          case 'else':
            insertAtCursor(`else:\n${indent}    `, 6 + indent.length + 4);
            break;
          case 'elif':
            insertAtCursor(`elif :\n${indent}    `, 5);
            break;
          case 'while':
            insertAtCursor(`while :\n${indent}    `, 6);
            break;
          case 'for_range':
            insertAtCursor(`for i in range():\n${indent}    `, 15);
            break;
          case 'def':
            insertAtCursor(`def func():\n${indent}    `, 8);
            break;
        }
      });

      // Dynamic Turtle Toolbar clicks
      turtleBar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-turtle]');
        if (!btn) return;
        const cmd = btn.dataset.turtle;
        const info = detectTurtleMode(editor.value);
        let prefix = '';
        if (info.instanceVar) {
          prefix = info.instanceVar + '.';
        } else if (info.style === 'module' || info.style === 'alias') {
          prefix = info.alias + '.';
        }

        const templates = {
          shape: [`${prefix}shape("")`, `${prefix}shape("`.length],
          width: [`${prefix}width()`, `${prefix}width(`.length],
          color: [`${prefix}color("")`, `${prefix}color("`.length],
          forward: [`${prefix}forward()`, `${prefix}forward(`.length],
          left: [`${prefix}left()`, `${prefix}left(`.length],
          right: [`${prefix}right()`, `${prefix}right(`.length],
          goto: [`${prefix}goto(, )`, `${prefix}goto(`.length],
          begin_fill: [`${prefix}begin_fill()`, `${prefix}begin_fill()`.length],
          end_fill: [`${prefix}end_fill()`, `${prefix}end_fill()`.length],
        };

        const tpl = templates[cmd];
        if (tpl) {
          insertAtCursor(tpl[0], tpl[1]);
        }
      });

      /* ============================================================
         TURTLE GRAPHICS ENGINE
         ============================================================ */
      const turtleEngine = {
        x: 0,
        y: 0,
        angle: 0, // degrees, 0 = right, 90 = up
        penDown: true,
        penColor: '#0f172a',
        fillColor: '#0f172a',
        bgColor: '#ffffff',
        lineWidth: 2,
        shape: 'classic',
        visible: true,
        speed: 6,
        filling: false,
        fillStartIdx: 0,
        fillPoints: [],
        commands: [], // { type: 'line'|'fill'|'dot', ... }

        reset() {
          this.x = 0;
          this.y = 0;
          this.angle = 0;
          this.penDown = true;
          this.penColor = '#0f172a';
          this.fillColor = '#0f172a';
          this.bgColor = '#ffffff';
          this.lineWidth = 2;
          this.shape = 'classic';
          this.visible = true;
          this.speed = 6;
          this.filling = false;
          this.fillStartIdx = 0;
          this.fillPoints = [];
          this.commands = [];
          this.updateHud();
          this.render();
        },

        clearDrawing() {
          this.commands = [];
          this.filling = false;
          this.fillStartIdx = 0;
          this.fillPoints = [];
          this.render();
        },

        updateHud() {
          const rx = Math.round(this.x * 10) / 10;
          const ry = Math.round(this.y * 10) / 10;
          const ra = Math.round(((this.angle % 360) + 360) % 360);
          turtleHud.textContent = `x: ${rx}, y: ${ry} | кут: ${ra}°`;
        },

        moveTo(nx, ny) {
          if (this.penDown) {
            this.commands.push({
              type: 'line',
              x1: this.x,
              y1: this.y,
              x2: nx,
              y2: ny,
              color: this.penColor,
              width: this.lineWidth
            });
          }
          this.x = nx;
          this.y = ny;
          if (this.filling) {
            this.fillPoints.push({ x: nx, y: ny });
          }
          this.updateHud();
          this.render();
        },

        forward(dist) {
          const rad = (this.angle * Math.PI) / 180;
          const nx = this.x + dist * Math.cos(rad);
          const ny = this.y + dist * Math.sin(rad);
          this.moveTo(nx, ny);
        },

        left(deg) {
          this.angle += deg;
          this.updateHud();
          this.render();
        },

        right(deg) {
          this.angle -= deg;
          this.updateHud();
          this.render();
        },

        setHeading(deg) {
          this.angle = deg;
          this.updateHud();
          this.render();
        },

        beginFill() {
          this.filling = true;
          this.fillStartIdx = this.commands.length;
          this.fillPoints = [{ x: this.x, y: this.y }];
        },

        endFill() {
          if (this.filling && this.fillPoints.length >= 3) {
            this.commands.splice(this.fillStartIdx, 0, {
              type: 'fill',
              points: this.fillPoints.slice(),
              color: this.fillColor
            });
          }
          this.filling = false;
          this.fillPoints = [];
          this.render();
        },

        dot(size, color) {
          const d = size ?? Math.max(this.lineWidth + 4, this.lineWidth * 2);
          this.commands.push({
            type: 'dot',
            x: this.x,
            y: this.y,
            size: d,
            color: color || this.penColor
          });
          this.render();
        },

        circle(radius, extent = 360, steps = null) {
          if (radius === 0) return;
          const absR = Math.abs(radius);
          const segs = steps ? Math.max(3, Math.round(steps)) : Math.max(18, Math.min(90, Math.round((Math.abs(extent) / 360) * Math.max(24, absR * 0.6))));
          const stepAngle = (extent / segs) * (radius >= 0 ? 1 : -1);
          const chord = 2 * absR * Math.sin((Math.abs(extent) * Math.PI) / (360 * segs));
          for (let i = 0; i < segs; i++) {
            this.angle += stepAngle / 2;
            const rad = (this.angle * Math.PI) / 180;
            const nx = this.x + chord * Math.cos(rad);
            const ny = this.y + chord * Math.sin(rad);
            if (this.penDown) {
              this.commands.push({
                type: 'line',
                x1: this.x,
                y1: this.y,
                x2: nx,
                y2: ny,
                color: this.penColor,
                width: this.lineWidth
              });
            }
            this.x = nx;
            this.y = ny;
            if (this.filling) {
              this.fillPoints.push({ x: nx, y: ny });
            }
            this.angle += stepAngle / 2;
          }
          this.updateHud();
          this.render();
        },

        async stepDelay() {
          if (this.speed === 0 || this.speed >= 10) return;
          const ms = Math.max(6, (10 - this.speed) * 14);
          await new Promise((r) => setTimeout(r, ms));
        },

        render() {
          const rect = turtleWrap.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = Math.round(rect.width * dpr);
          const h = Math.round(rect.height * dpr);
          if (turtleCanvas.width !== w || turtleCanvas.height !== h) {
            turtleCanvas.width = w;
            turtleCanvas.height = h;
          }
          const ctx = turtleCanvas.getContext('2d');
          ctx.save();
          ctx.scale(dpr, dpr);

          const cw = rect.width;
          const ch = rect.height;
          const cx = cw / 2;
          const cy = ch / 2;

          // Background
          ctx.fillStyle = this.bgColor || '#ffffff';
          ctx.fillRect(0, 0, cw, ch);

          // Subtle coordinate axes at center
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, cy);
          ctx.lineTo(cw, cy);
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx, ch);
          ctx.stroke();

          // Pass 1: Fills (and lines interleaved in command order)
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (const cmd of this.commands) {
            if (cmd.type === 'fill') {
              ctx.fillStyle = cmd.color;
              ctx.beginPath();
              cmd.points.forEach((pt, idx) => {
                const sx = cx + pt.x;
                const sy = cy - pt.y;
                if (idx === 0) ctx.moveTo(sx, sy);
                else ctx.lineTo(sx, sy);
              });
              ctx.closePath();
              ctx.fill();
            } else if (cmd.type === 'line') {
              ctx.strokeStyle = cmd.color;
              ctx.lineWidth = cmd.width;
              ctx.beginPath();
              ctx.moveTo(cx + cmd.x1, cy - cmd.y1);
              ctx.lineTo(cx + cmd.x2, cy - cmd.y2);
              ctx.stroke();
            } else if (cmd.type === 'dot') {
              ctx.fillStyle = cmd.color;
              ctx.beginPath();
              ctx.arc(cx + cmd.x, cy - cmd.y, cmd.size / 2, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Turtle cursor
          if (this.visible) {
            ctx.save();
            ctx.translate(cx + this.x, cy - this.y);
            ctx.rotate((-this.angle * Math.PI) / 180);
            this.drawCursor(ctx);
            ctx.restore();
          }

          ctx.restore();
        },

        drawCursor(ctx) {
          const fill = this.fillColor || '#10b981';
          const stroke = this.penColor || '#0f172a';
          ctx.fillStyle = fill;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.6;

          switch (this.shape) {
            case 'turtle': {
              // Legs
              ctx.fillStyle = '#059669';
              [[-5, -7], [5, -7], [-5, 7], [5, 7]].forEach(([lx, ly]) => {
                ctx.beginPath();
                ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
                ctx.fill();
              });
              // Head
              ctx.beginPath();
              ctx.arc(9, 0, 3.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              // Shell
              ctx.fillStyle = fill === '#0f172a' ? '#10b981' : fill;
              ctx.beginPath();
              ctx.ellipse(0, 0, 7.5, 6, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              break;
            }
            case 'circle': {
              ctx.beginPath();
              ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              break;
            }
            case 'square': {
              ctx.beginPath();
              ctx.rect(-6, -6, 12, 12);
              ctx.fill();
              ctx.stroke();
              break;
            }
            case 'triangle': {
              ctx.beginPath();
              ctx.moveTo(9, 0);
              ctx.lineTo(-6, -6);
              ctx.lineTo(-6, 6);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              break;
            }
            case 'arrow':
            case 'classic':
            default: {
              ctx.beginPath();
              ctx.moveTo(10, 0);
              ctx.lineTo(-6, -5.5);
              ctx.lineTo(-3, 0);
              ctx.lineTo(-6, 5.5);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              break;
            }
          }
        }
      };

      /* ============================================================
         UKRAINIAN FRIENDLY ERROR HELPER
         ============================================================ */
      class PyTutorError extends Error {
        constructor({ title, line, what, fix }) {
          super(what);
          this.title = title || 'Помилка у програмі';
          this.line = line || 1;
          this.what = what;
          this.fix = fix;
        }
      }

      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            dp[i][j] = Math.min(
              dp[i - 1][j] + 1,
              dp[i][j - 1] + 1,
              dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
          }
        }
        return dp[m][n];
      }

      function findClosestName(target, candidates) {
        let best = null;
        let bestDist = 3;
        for (const c of candidates) {
          const d = levenshtein(target.toLowerCase(), c.toLowerCase());
          if (d < bestDist) {
            bestDist = d;
            best = c;
          }
        }
        return best;
      }

      const TURTLE_COMMANDS = new Set([
        'forward', 'fd', 'backward', 'bk', 'back', 'left', 'lt', 'right', 'rt',
        'goto', 'setpos', 'setposition', 'setx', 'sety', 'home', 'setheading', 'seth',
        'penup', 'pu', 'up', 'pendown', 'pd', 'down', 'width', 'pensize',
        'color', 'pencolor', 'fillcolor', 'bgcolor', 'shape',
        'begin_fill', 'end_fill', 'circle', 'dot', 'hideturtle', 'ht',
        'showturtle', 'st', 'speed', 'clear', 'reset', 'done', 'mainloop',
        'xcor', 'ycor', 'heading', 'position', 'pos'
      ]);

      /* ============================================================
         PYTHON SUBSET LEXER
         ============================================================ */
      const KEYWORDS = new Set([
        'False', 'None', 'True', 'and', 'as', 'break', 'continue', 'def',
        'elif', 'else', 'for', 'from', 'global', 'if', 'import', 'in',
        'is', 'not', 'or', 'pass', 'return', 'while'
      ]);

      function tokenize(source) {
        const rawLines = source.replace(/\r\n?/g, '\n').split('\n');
        const tokens = [];
        const indentStack = [0];
        const openBrackets = []; // { char, line }

        for (let lineIdx = 0; lineIdx < rawLines.length; lineIdx++) {
          const lineNum = lineIdx + 1;
          const rawLine = rawLines[lineIdx];

          // Normalize leading tabs to 4 spaces
          let i = 0;
          let indent = 0;
          while (i < rawLine.length && (rawLine[i] === ' ' || rawLine[i] === '\t')) {
            indent += rawLine[i] === '\t' ? 4 : 1;
            i++;
          }

          // Skip blank or comment-only lines
          if (i >= rawLine.length || rawLine[i] === '#') {
            continue;
          }

          // Handle indentation only when not inside () or []
          if (openBrackets.length === 0) {
            const topIndent = indentStack[indentStack.length - 1];
            if (indent > topIndent) {
              if (tokens.length === 0) {
                throw new PyTutorError({
                  title: 'Помилка відступу (IndentationError)',
                  line: lineNum,
                  what: 'Перший рядок програми починається з зайвого відступу (пробілів на початку).',
                  fix: 'Прибери зайві пробіли на початку цього рядка, щоб код починався з лівого краю.'
                });
              }
              indentStack.push(indent);
              tokens.push({ type: 'INDENT', value: indent, line: lineNum });
            } else if (indent < topIndent) {
              while (indentStack.length > 1 && indent < indentStack[indentStack.length - 1]) {
                indentStack.pop();
                tokens.push({ type: 'DEDENT', value: indent, line: lineNum });
              }
              if (indent !== indentStack[indentStack.length - 1]) {
                throw new PyTutorError({
                  title: 'Помилка відступу (IndentationError)',
                  line: lineNum,
                  what: 'Відступ у цьому рядку не збігається з жодним попереднім рівнем блоку.',
                  fix: 'Вирівняй кількість пробілів на початку рядка (використовуй по 4 пробіли на кожен рівень після двокрапки :).'
                });
              }
            }
          }

          // Scan tokens on line
          while (i < rawLine.length) {
            const ch = rawLine[i];

            if (ch === ' ' || ch === '\t') {
              i++;
              continue;
            }
            if (ch === '#') {
              break;
            }

            // f-string or normal string
            let isFString = false;
            if ((ch === 'f' || ch === 'F') && (rawLine[i + 1] === '"' || rawLine[i + 1] === "'")) {
              isFString = true;
              i++;
            }

            if (rawLine[i] === '"' || rawLine[i] === "'") {
              const quote = rawLine[i];
              i++;
              let strVal = '';
              let closed = false;
              while (i < rawLine.length) {
                const c = rawLine[i];
                if (c === '\\') {
                  if (i + 1 < rawLine.length) {
                    const next = rawLine[i + 1];
                    if (next === 'n') strVal += '\n';
                    else if (next === 't') strVal += '\t';
                    else if (next === '\\') strVal += '\\';
                    else if (next === '"') strVal += '"';
                    else if (next === "'") strVal += "'";
                    else strVal += '\\' + next;
                    i += 2;
                    continue;
                  }
                }
                if (c === quote) {
                  closed = true;
                  i++;
                  break;
                }
                strVal += c;
                i++;
              }
              if (!closed) {
                throw new PyTutorError({
                  title: 'Незакриті лапки (SyntaxError)',
                  line: lineNum,
                  what: `Текст відкрито лапкою ${quote}, але забули закрити її в кінці рядка.`,
                  fix: `Додай закриваючу лапку ${quote} у кінці тексту.`
                });
              }
              tokens.push({ type: isFString ? 'FSTRING' : 'STRING', value: strVal, line: lineNum });
              continue;
            }

            // Numbers
            if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(rawLine[i + 1] || ''))) {
              let numStr = '';
              let hasDot = false;
              while (i < rawLine.length && (/[0-9]/.test(rawLine[i]) || (!hasDot && rawLine[i] === '.'))) {
                if (rawLine[i] === '.') hasDot = true;
                numStr += rawLine[i];
                i++;
              }
              if (/[A-Za-z_]/.test(rawLine[i] || '')) {
                throw new PyTutorError({
                  title: 'Неправильне ім’я або число (SyntaxError)',
                  line: lineNum,
                  what: 'Ім’я змінної не може починатися з цифри або літери стоять злито з числом.',
                  fix: 'Назва змінної має починатися з літери або _, а між числом і словом потрібен пробіл чи знак операції.'
                });
              }
              tokens.push({
                type: 'NUMBER',
                value: hasDot ? parseFloat(numStr) : parseInt(numStr, 10),
                isFloat: hasDot,
                line: lineNum
              });
              continue;
            }

            // Identifiers & Keywords
            if (/[A-Za-z_]/.test(ch)) {
              let id = '';
              while (i < rawLine.length && /[A-Za-z0-9_]/.test(rawLine[i])) {
                id += rawLine[i];
                i++;
              }
              tokens.push({
                type: KEYWORDS.has(id) ? 'KEYWORD' : 'IDENT',
                value: id,
                line: lineNum
              });
              continue;
            }

            // Two-char & Three-char operators
            const three = rawLine.slice(i, i + 3);
            if (three === '//=' || three === '**=') {
              tokens.push({ type: 'OP', value: three, line: lineNum });
              i += 3;
              continue;
            }
            const two = rawLine.slice(i, i + 2);
            if (['**', '//', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%='].includes(two)) {
              tokens.push({ type: 'OP', value: two, line: lineNum });
              i += 2;
              continue;
            }

            // Brackets
            if (ch === '(' || ch === '[') {
              openBrackets.push({ char: ch, line: lineNum });
              tokens.push({ type: 'OP', value: ch, line: lineNum });
              i++;
              continue;
            }
            if (ch === ')' || ch === ']') {
              const expected = ch === ')' ? '(' : '[';
              if (openBrackets.length === 0) {
                throw new PyTutorError({
                  title: 'Зайва дужка (SyntaxError)',
                  line: lineNum,
                  what: `Знайдено закриваючу дужку «${ch}», але для неї немає відкриваючої «${expected}».`,
                  fix: `Прибери зайву дужку «${ch}» або додай відкриваючу «${expected}» перед нею.`
                });
              }
              const last = openBrackets.pop();
              if (last.char !== expected) {
                throw new PyTutorError({
                  title: 'Неузгоджені дужки (SyntaxError)',
                  line: lineNum,
                  what: `Відкрито «${last.char}» у рядку ${last.line}, а закрито «${ch}» у рядку ${lineNum}.`,
                  fix: `Заміни дужку на правильну пару (${last.char === '(' ? ')' : ']'}).`
                });
              }
              tokens.push({ type: 'OP', value: ch, line: lineNum });
              i++;
              continue;
            }

            // Single-char operators & punctuation
            if ('+-*/%<>=.,:;'.includes(ch)) {
              tokens.push({ type: 'OP', value: ch, line: lineNum });
              i++;
              continue;
            }

            if (ch === '!') {
              throw new PyTutorError({
                title: 'Невідомий символ «!» (SyntaxError)',
                line: lineNum,
                what: 'У Python знак «!» сам по собі не використовується. Для «не дорівнює» пишуть «!=», а для логічного заперечення — слово «not».',
                fix: 'Заміни «!» на «!=» (якщо це порівняння) або на слово «not».'
              });
            }

            // Friendly Ukrainian quote mistakes (‘ ’ “ ” « »)
            if ('“”«»‘’'.includes(ch)) {
              throw new PyTutorError({
                title: 'Неправильні лапки (SyntaxError)',
                line: lineNum,
                what: `Використано типографські лапки «${ch}», які Python не розуміє.`,
                fix: 'Заміни їх на звичайні прямі лапки " або \' (можна вставити кнопкою "" на панелі).'
              });
            }

            throw new PyTutorError({
              title: 'Невідомий символ (SyntaxError)',
              line: lineNum,
              what: `У коді зустрівся незрозумілий для Python символ «${ch}».`,
              fix: 'Перевір правопис у цьому рядку та прибери зайвий символ.'
            });
          }

          if (openBrackets.length === 0) {
            tokens.push({ type: 'NEWLINE', value: '\n', line: lineNum });
          }
        }

        if (openBrackets.length > 0) {
          const unclosed = openBrackets[openBrackets.length - 1];
          const pair = unclosed.char === '(' ? ')' : ']';
          throw new PyTutorError({
            title: 'Незакрита дужка (SyntaxError)',
            line: unclosed.line,
            what: `У рядку ${unclosed.line} відкрито дужку «${unclosed.char}», але її забули закрити.`,
            fix: `Додай закриваючу дужку «${pair}» у потрібному місці.`
          });
        }

        while (indentStack.length > 1) {
          indentStack.pop();
          tokens.push({ type: 'DEDENT', value: 0, line: rawLines.length });
        }
        tokens.push({ type: 'EOF', value: null, line: rawLines.length });
        return tokens;
      }

      /* ============================================================
         PYTHON SUBSET PARSER (AST)
         ============================================================ */
      function parse(tokens, rawLines) {
        let pos = 0;
        const peek = (offset = 0) => tokens[Math.min(pos + offset, tokens.length - 1)];
        const at = (type, value = null) => {
          const t = peek();
          if (t.type !== type) return false;
          return value === null ? true : t.value === value;
        };
        const advance = () => tokens[pos++];

        function expect(type, value, errorInfo) {
          const t = peek();
          if (t.type === type && (value === null || t.value === value)) {
            return advance();
          }
          throw new PyTutorError({
            title: errorInfo.title || 'Синтаксична помилка (SyntaxError)',
            line: errorInfo.line || t.line,
            what: errorInfo.what,
            fix: errorInfo.fix
          });
        }

        function skipNewlines() {
          while (at('NEWLINE')) advance();
        }

        function parseProgram() {
          const body = [];
          skipNewlines();
          while (!at('EOF')) {
            body.push(...parseStatementLine());
            skipNewlines();
          }
          return { type: 'Program', body };
        }

        function parseStatementLine() {
          const t = peek();
          // Compound statements cannot be chained after ';' cleanly, handle directly
          if (
            (t.type === 'KEYWORD' && ['if', 'while', 'for', 'def'].includes(t.value))
          ) {
            return [parseStatement()];
          }
          const stmts = [parseSimpleStatement()];
          while (at('OP', ';')) {
            advance();
            if (at('NEWLINE') || at('EOF')) break;
            stmts.push(parseSimpleStatement());
          }
          if (at('NEWLINE')) advance();
          else if (!at('EOF') && !at('DEDENT')) {
            const cur = peek();
            throw new PyTutorError({
              title: 'Синтаксична помилка (SyntaxError)',
              line: cur.line,
              what: `Неочікуваний елемент «${cur.value}» у цьому рядку.`,
              fix: 'Перевір, чи не пропущено знак операції, кому або перенос рядка.'
            });
          }
          return stmts;
        }

        function parseBlock(parentKeyword, headerLine) {
          if (!at('OP', ':')) {
            throw new PyTutorError({
              title: 'Пропущено двокрапку «:» (SyntaxError)',
              line: headerLine,
              what: `Після умови або заголовка «${parentKeyword}» обов’язково має стояти двокрапка (:).`,
              fix: `Додай символ «:» у кінці рядка ${headerLine}.`
            });
          }
          advance(); // consume ':'

          if (!at('NEWLINE')) {
            // Single-line suite like `if x > 0: print(x)`
            const inlineStmts = [parseSimpleStatement()];
            while (at('OP', ';')) {
              advance();
              if (at('NEWLINE') || at('EOF')) break;
              inlineStmts.push(parseSimpleStatement());
            }
            if (at('NEWLINE')) advance();
            return inlineStmts;
          }

          advance(); // NEWLINE
          skipNewlines();

          if (!at('INDENT')) {
            throw new PyTutorError({
              title: 'Очікується відступ (IndentationError)',
              line: Math.min(headerLine + 1, rawLines.length),
              what: `Після рядка з «${parentKeyword} ... :» наступний рядок має бути з відступом (4 пробіли).`,
              fix: `Додай 4 пробіли на початку рядка під «${parentKeyword}» (можна кнопкою ⇥).`
            });
          }
          advance(); // INDENT

          const body = [];
          skipNewlines();
          while (!at('DEDENT') && !at('EOF')) {
            body.push(...parseStatementLine());
            skipNewlines();
          }
          if (at('DEDENT')) advance();
          return body;
        }

        function checkAssignmentInCondition(condLine) {
          // Catch `if x = 5:` style mistake cleanly during parsing
        }

        function parseStatement() {
          const t = peek();
          if (t.type === 'KEYWORD') {
            if (t.value === 'if') return parseIf();
            if (t.value === 'while') return parseWhile();
            if (t.value === 'for') return parseFor();
            if (t.value === 'def') return parseDef();
          }
          const stmts = parseStatementLine();
          return stmts[0];
        }

        function parseCondition(kw, line) {
          // Peek ahead before ':' or NEWLINE to catch single '=' mistake
          let scan = pos;
          let depth = 0;
          while (scan < tokens.length) {
            const tk = tokens[scan];
            if (tk.type === 'NEWLINE' || tk.type === 'EOF') break;
            if (tk.type === 'OP' && (tk.value === '(' || tk.value === '[')) depth++;
            if (tk.type === 'OP' && (tk.value === ')' || tk.value === ']')) depth--;
            if (depth === 0 && tk.type === 'OP' && tk.value === ':') break;
            if (depth === 0 && tk.type === 'OP' && tk.value === '=') {
              throw new PyTutorError({
                title: 'Плутанина «=» і «==» (SyntaxError)',
                line: tk.line,
                what: `В умові «${kw}» використано один знак «=», який записує значення у змінну, а не порівнює.`,
                fix: 'Для порівняння двох значень в умові використовуй подвійний знак «==», наприклад: if x == 5:'
              });
            }
            scan++;
          }
          if (at('OP', ':') || at('NEWLINE')) {
            throw new PyTutorError({
              title: 'Порожня умова (SyntaxError)',
              line,
              what: `Після слова «${kw}» потрібно написати умову (наприклад, x > 0).`,
              fix: `Додай логічний вираз між «${kw}» і «:».`
            });
          }
          return parseExpr();
        }

        function parseIf() {
          const line = advance().line; // 'if'
          const test = parseCondition('if', line);
          const body = parseBlock('if', line);
          const elifs = [];
          let elseBody = null;

          skipNewlines();
          while (at('KEYWORD', 'elif')) {
            const elifLine = advance().line;
            const eTest = parseCondition('elif', elifLine);
            const eBody = parseBlock('elif', elifLine);
            elifs.push({ test: eTest, body: eBody, line: elifLine });
            skipNewlines();
          }

          if (at('KEYWORD', 'else')) {
            const elseLine = advance().line;
            elseBody = parseBlock('else', elseLine);
          }

          return { type: 'IfStmt', test, body, elifs, elseBody, line };
        }

        function parseWhile() {
          const line = advance().line; // 'while'
          const test = parseCondition('while', line);
          const body = parseBlock('while', line);
          return { type: 'WhileStmt', test, body, line };
        }

        function parseFor() {
          const line = advance().line; // 'for'
          const targets = [];
          const first = expect('IDENT', null, {
            title: 'Помилка у циклі for (SyntaxError)',
            line,
            what: 'Після слова «for» має бути назва змінної циклу (наприклад, i).',
            fix: 'Напиши: for i in range(5):'
          });
          targets.push(first.value);
          while (at('OP', ',')) {
            advance();
            const nxt = expect('IDENT', null, {
              title: 'Помилка у циклі for (SyntaxError)',
              line,
              what: 'Очікується назва змінної після коми у циклі for.',
              fix: 'Перевір список змінних після слова for.'
            });
            targets.push(nxt.value);
          }
          expect('KEYWORD', 'in', {
            title: 'Пропущено слово «in» (SyntaxError)',
            line,
            what: 'У циклі for після змінної обов’язково має стояти слово «in».',
            fix: 'Напиши: for i in range(5):'
          });
          const iter = parseExpr();
          const body = parseBlock('for', line);
          return { type: 'ForStmt', targets, iter, body, line };
        }

        function parseDef() {
          const line = advance().line; // 'def'
          const nameTok = expect('IDENT', null, {
            title: 'Неправильне оголошення функції (SyntaxError)',
            line,
            what: 'Після «def» потрібно вказати назву функції.',
            fix: 'Наприклад: def my_func():'
          });
          expect('OP', '(', {
            title: 'Пропущено дужки «()» у функції (SyntaxError)',
            line,
            what: `Після назви функції «${nameTok.value}» обов’язково мають іти круглі дужки ().`,
            fix: `Напиши: def ${nameTok.value}():`
          });
          const params = [];
          while (!at('OP', ')')) {
            const p = expect('IDENT', null, {
              title: 'Помилка в параметрах функції (SyntaxError)',
              line,
              what: 'У дужках після def мають бути назви параметрів через кому.',
              fix: 'Наприклад: def suma(a, b):'
            });
            let defaultVal = null;
            if (at('OP', '=')) {
              advance();
              defaultVal = parseExpr();
            }
            params.push({ name: p.value, defaultVal });
            if (at('OP', ',')) advance();
            else break;
          }
          expect('OP', ')', {
            title: 'Незакрита дужка у функції (SyntaxError)',
            line,
            what: 'Забули закрити круглу дужку «)» у списку параметрів функції.',
            fix: 'Додай «)» перед двокрапкою «:».'
          });
          const body = parseBlock('def', line);
          return { type: 'DefStmt', name: nameTok.value, params, body, line };
        }

        function parseSimpleStatement() {
          const t = peek();
          if (t.type === 'KEYWORD') {
            if (t.value === 'import') return parseImport();
            if (t.value === 'from') return parseFromImport();
            if (t.value === 'return') {
              const line = advance().line;
              if (at('NEWLINE') || at('OP', ';') || at('EOF') || at('DEDENT')) {
                return { type: 'ReturnStmt', value: null, line };
              }
              return { type: 'ReturnStmt', value: parseExpr(), line };
            }
            if (t.value === 'break') {
              return { type: 'BreakStmt', line: advance().line };
            }
            if (t.value === 'continue') {
              return { type: 'ContinueStmt', line: advance().line };
            }
            if (t.value === 'pass') {
              return { type: 'PassStmt', line: advance().line };
            }
            if (t.value === 'global') {
              const line = advance().line;
              const names = [];
              const first = expect('IDENT', null, {
                title: 'Помилка у global (SyntaxError)',
                line,
                what: 'Після слова «global» треба вказати назву змінної.',
                fix: 'Наприклад: global score'
              });
              names.push(first.value);
              while (at('OP', ',')) {
                advance();
                names.push(expect('IDENT', null, {
                  title: 'Помилка у global (SyntaxError)',
                  line,
                  what: 'Очікується назва змінної після коми.',
                  fix: 'Перевір перелік змінних після global.'
                }).value);
              }
              return { type: 'GlobalStmt', names, line };
            }
            if (t.value === 'else' || t.value === 'elif') {
              throw new PyTutorError({
                title: `Несподіване «${t.value}» (SyntaxError)`,
                line: t.line,
                what: `Блок «${t.value}» не може бути сам по собі або має неправильний відступ.`,
                fix: `Переконайся, що перед «${t.value}» є відповідний «if» на тому ж рівні відступу.`
              });
            }
          }

          // Expression or Assignment (including tuple unpacking a, b = ...)
          const expr = parseTupleOrExpr();
          const nxt = peek();
          if (nxt.type === 'OP' && ['=', '+=', '-=', '*=', '/=', '//=', '%=', '**='].includes(nxt.value)) {
            const op = advance().value;
            const rhs = parseTupleOrExpr();
            return { type: 'AssignStmt', target: expr, op, value: rhs, line: t.line };
          }
          return { type: 'ExprStmt', expr, line: t.line };
        }

        function parseImport() {
          const line = advance().line; // 'import'
          const mods = [];
          while (true) {
            const mod = expect('IDENT', null, {
              title: 'Помилка імпорту (SyntaxError)',
              line,
              what: 'Після слова «import» має бути назва модуля (наприклад, turtle).',
              fix: 'Напиши: import turtle'
            });
            let alias = mod.value;
            if (at('KEYWORD', 'as')) {
              advance();
              alias = expect('IDENT', null, {
                title: 'Помилка імпорту (SyntaxError)',
                line,
                what: 'Після «as» потрібно написати коротке ім’я (наприклад, t).',
                fix: 'Напиши: import turtle as t'
              }).value;
            }
            mods.push({ name: mod.value, alias });
            if (at('OP', ',')) advance();
            else break;
          }
          return { type: 'ImportStmt', mods, line };
        }

        function parseFromImport() {
          const line = advance().line; // 'from'
          const mod = expect('IDENT', null, {
            title: 'Помилка імпорту (SyntaxError)',
            line,
            what: 'Після «from» потрібно вказати назву модуля (наприклад, turtle).',
            fix: 'Напиши: from turtle import *'
          });
          expect('KEYWORD', 'import', {
            title: 'Пропущено «import» (SyntaxError)',
            line,
            what: `У конструкції «from ${mod.value} ...» не вистачає слова «import».`,
            fix: `Напиши: from ${mod.value} import *`
          });
          if (at('OP', '*')) {
            advance();
            return { type: 'FromImportStmt', module: mod.value, names: ['*'], line };
          }
          const names = [];
          while (true) {
            const n = expect('IDENT', null, {
              title: 'Помилка імпорту (SyntaxError)',
              line,
              what: 'Вкажи назву команди або «*» після слова import.',
              fix: `Напиши: from ${mod.value} import *`
            });
            let alias = n.value;
            if (at('KEYWORD', 'as')) {
              advance();
              alias = expect('IDENT', null, {
                title: 'Помилка імпорту (SyntaxError)',
                line,
                what: 'Вкажи псевдонім після слова as.',
                fix: 'Перевір рядок import.'
              }).value;
            }
            names.push({ name: n.value, alias });
            if (at('OP', ',')) advance();
            else break;
          }
          return { type: 'FromImportStmt', module: mod.value, names, line };
        }

        function parseTupleOrExpr() {
          const first = parseExpr();
          if (at('OP', ',')) {
            const items = [first];
            while (at('OP', ',')) {
              advance();
              if (at('OP', '=') || at('NEWLINE') || at('EOF') || at('OP', ';')) break;
              items.push(parseExpr());
            }
            return { type: 'TupleExpr', items, line: first.line };
          }
          return first;
        }

        function parseExpr() {
          return parseOr();
        }

        function parseOr() {
          let left = parseAnd();
          while (at('KEYWORD', 'or')) {
            const line = advance().line;
            const right = parseAnd();
            left = { type: 'BoolOp', op: 'or', left, right, line };
          }
          return left;
        }

        function parseAnd() {
          let left = parseNot();
          while (at('KEYWORD', 'and')) {
            const line = advance().line;
            const right = parseNot();
            left = { type: 'BoolOp', op: 'and', left, right, line };
          }
          return left;
        }

        function parseNot() {
          if (at('KEYWORD', 'not')) {
            const line = advance().line;
            return { type: 'UnaryOp', op: 'not', arg: parseNot(), line };
          }
          return parseComparison();
        }

        function parseComparison() {
          const left = parseAddSub();
          const ops = [];
          const comparators = [];

          while (true) {
            const t = peek();
            if (t.type === 'OP' && ['==', '!=', '<', '<=', '>', '>='].includes(t.value)) {
              ops.push(advance().value);
              comparators.push(parseAddSub());
            } else if (t.type === 'KEYWORD' && t.value === 'in') {
              advance();
              ops.push('in');
              comparators.push(parseAddSub());
            } else if (t.type === 'KEYWORD' && t.value === 'not' && peek(1).type === 'KEYWORD' && peek(1).value === 'in') {
              advance(); advance();
              ops.push('not in');
              comparators.push(parseAddSub());
            } else if (t.type === 'KEYWORD' && t.value === 'is') {
              advance();
              if (at('KEYWORD', 'not')) {
                advance();
                ops.push('is not');
              } else {
                ops.push('is');
              }
              comparators.push(parseAddSub());
            } else {
              break;
            }
          }

          if (ops.length === 0) return left;
          return { type: 'Compare', left, ops, comparators, line: left.line };
        }

        function parseAddSub() {
          let left = parseMulDiv();
          while (at('OP', '+') || at('OP', '-')) {
            const op = advance();
            const right = parseMulDiv();
            left = { type: 'BinOp', op: op.value, left, right, line: op.line };
          }
          return left;
        }

        function parseMulDiv() {
          let left = parseUnary();
          while (at('OP', '*') || at('OP', '/') || at('OP', '//') || at('OP', '%')) {
            const op = advance();
            const right = parseUnary();
            left = { type: 'BinOp', op: op.value, left, right, line: op.line };
          }
          return left;
        }

        function parseUnary() {
          if (at('OP', '+') || at('OP', '-')) {
            const op = advance();
            return { type: 'UnaryOp', op: op.value, arg: parseUnary(), line: op.line };
          }
          return parsePower();
        }

        function parsePower() {
          const left = parsePostfix();
          if (at('OP', '**')) {
            const op = advance();
            const right = parseUnary();
            return { type: 'BinOp', op: '**', left, right, line: op.line };
          }
          return left;
        }

        function parsePostfix() {
          let expr = parsePrimary();
          while (true) {
            if (at('OP', '(')) {
              const callLine = advance().line;
              const args = [];
              const kwargs = {};
              while (!at('OP', ')')) {
                if (peek().type === 'IDENT' && peek(1).type === 'OP' && peek(1).value === '=') {
                  const kw = advance().value;
                  advance(); // '='
                  kwargs[kw] = parseExpr();
                } else {
                  args.push(parseExpr());
                }
                if (at('OP', ',')) advance();
                else break;
              }
              expect('OP', ')', {
                title: 'Незакрита дужка виклику (SyntaxError)',
                line: callLine,
                what: 'Забули закрити дужку «)» або поставити кому між аргументами.',
                fix: 'Перевір дужки та коми у виклику функції.'
              });
              expr = { type: 'Call', callee: expr, args, kwargs, line: callLine };
            } else if (at('OP', '.')) {
              const dotLine = advance().line;
              const prop = expect('IDENT', null, {
                title: 'Помилка після крапки (SyntaxError)',
                line: dotLine,
                what: 'Після крапки «.» має йти назва методу або властивості (наприклад, turtle.forward).',
                fix: 'Допиши команду після крапки.'
              });
              expr = { type: 'Attr', obj: expr, name: prop.value, line: dotLine };
            } else if (at('OP', '[')) {
              const brLine = advance().line;
              let start = null, end = null, isSlice = false;
              if (!at('OP', ':')) start = parseExpr();
              if (at('OP', ':')) {
                isSlice = true;
                advance();
                if (!at('OP', ']')) end = parseExpr();
              }
              expect('OP', ']', {
                title: 'Незакрита квадратна дужка (SyntaxError)',
                line: brLine,
                what: 'Забули закрити квадратну дужку «]».',
                fix: 'Додай «]» після індексу.'
              });
              expr = isSlice
                ? { type: 'Slice', obj: expr, start, end, line: brLine }
                : { type: 'Index', obj: expr, index: start, line: brLine };
            } else {
              break;
            }
          }
          return expr;
        }

        function parsePrimary() {
          const t = peek();
          if (t.type === 'NUMBER') {
            advance();
            return { type: 'Literal', value: t.value, line: t.line };
          }
          if (t.type === 'STRING') {
            advance();
            return { type: 'Literal', value: t.value, line: t.line };
          }
          if (t.type === 'FSTRING') {
            advance();
            return { type: 'FString', template: t.value, line: t.line };
          }
          if (t.type === 'KEYWORD') {
            if (t.value === 'True') { advance(); return { type: 'Literal', value: true, line: t.line }; }
            if (t.value === 'False') { advance(); return { type: 'Literal', value: false, line: t.line }; }
            if (t.value === 'None') { advance(); return { type: 'Literal', value: null, line: t.line }; }
          }
          if (t.type === 'IDENT') {
            advance();
            return { type: 'Ident', name: t.value, line: t.line };
          }
          if (t.type === 'OP' && t.value === '(') {
            const line = advance().line;
            if (at('OP', ')')) {
              advance();
