                } else if (m.name === 'math') {
                  assignVar(m.alias, mathMod, env);
                } else if (m.name === 'random') {
                  assignVar(m.alias, randomMod, env);
                } else {
                  throw new PyTutorError({
                    title: `Модуль «${m.name}» не знайдено (ModuleNotFoundError)`,
                    line: stmt.line,
                    what: `У цьому тренажері немає модуля «${m.name}». Доступні модулі: turtle, math, random.`,
                    fix: 'Якщо хочеш малювати Черепашкою, перевір слово: import turtle.'
                  });
                }
              }
              return;
            }
            case 'FromImportStmt': {
              if (stmt.module === 'turtle') {
                host.showTurtle();
                if (stmt.names[0] === '*') {
                  for (const [k, v] of Object.entries(turtleMod)) {
                    if (!k.startsWith('__')) assignVar(k, { __pyBuiltin: k, fn: v }, env);
                  }
                } else {
                  for (const item of stmt.names) {
                    if (!turtleMod[item.name]) {
                      throw new PyTutorError({
                        title: `Команди «${item.name}» немає в turtle`,
                        line: stmt.line,
                        what: `У модулі turtle не знайдено команду «${item.name}».`,
                        fix: 'Використай from turtle import *, щоб підключити всі команди черепашки.'
                      });
                    }
                    assignVar(item.alias, { __pyBuiltin: item.name, fn: turtleMod[item.name] }, env);
                  }
                }
              } else if (stmt.module === 'math' || stmt.module === 'random') {
                const mod = stmt.module === 'math' ? mathMod : randomMod;
                if (stmt.names[0] === '*') {
                  for (const [k, v] of Object.entries(mod)) {
                    if (!k.startsWith('__')) {
                      assignVar(k, typeof v === 'function' ? { __pyBuiltin: k, fn: v } : v, env);
                    }
                  }
                } else {
                  for (const item of stmt.names) {
                    const v = mod[item.name];
                    assignVar(item.alias, typeof v === 'function' ? { __pyBuiltin: item.name, fn: v } : v, env);
                  }
                }
              } else {
                throw new PyTutorError({
                  title: `Модуль «${stmt.module}» не знайдено`,
                  line: stmt.line,
                  what: `Модуль «${stmt.module}» недоступний у цьому тренажері.`,
                  fix: 'Перевір назву модуля (наприклад, from turtle import *).'
                });
              }
              return;
            }
            case 'DefStmt': {
              const fnObj = {
                __pyType: 'function',
                name: stmt.name,
                params: stmt.params,
                body: stmt.body,
                closure: env
              };
              assignVar(stmt.name, fnObj, env);
              return;
            }
            case 'IfStmt': {
              if (isTruthy(await evalExpr(stmt.test, env))) {
                await execBlock(stmt.body, env);
                return;
              }
              for (const el of stmt.elifs) {
                if (isTruthy(await evalExpr(el.test, env))) {
                  await execBlock(el.body, env);
                  return;
                }
              }
              if (stmt.elseBody) {
                await execBlock(stmt.elseBody, env);
              }
              return;
            }
            case 'WhileStmt': {
              while (isTruthy(await evalExpr(stmt.test, env))) {
                await tick(stmt.line);
                try {
                  await execBlock(stmt.body, env);
                } catch (sig) {
                  if (sig instanceof BreakSignal) break;
                  if (sig instanceof ContinueSignal) continue;
                  throw sig;
                }
              }
              return;
            }
            case 'ForStmt': {
              const iterable = await evalExpr(stmt.iter, env);
              let items;
              if (typeof iterable === 'string') items = [...iterable];
              else if (Array.isArray(iterable)) items = iterable;
              else {
                throw new PyTutorError({
                  title: 'Не можна перебирати в циклі for (TypeError)',
                  line: stmt.line,
                  what: `Цикл for може перебирати range(), список або текст, а не «${pyStr(iterable)}».`,
                  fix: 'Використай range(...), наприклад: for i in range(5):'
                });
              }
              for (const item of items) {
                await tick(stmt.line);
                if (stmt.targets.length === 1) {
                  assignVar(stmt.targets[0], item, env);
                } else if (Array.isArray(item) && item.length === stmt.targets.length) {
                  stmt.targets.forEach((t, idx) => assignVar(t, item[idx], env));
                }
                try {
                  await execBlock(stmt.body, env);
                } catch (sig) {
                  if (sig instanceof BreakSignal) break;
                  if (sig instanceof ContinueSignal) continue;
                  throw sig;
                }
              }
              return;
            }
            case 'AssignStmt': {
              const val = await evalExpr(stmt.value, env);
              if (stmt.op === '=') {
                await assignTarget(stmt.target, val, env, stmt.line);
              } else {
                const cur = await evalExpr(stmt.target, env);
                const binOp = stmt.op.slice(0, -1);
                const next = evalBinary(binOp, cur, val, stmt.line);
                await assignTarget(stmt.target, next, env, stmt.line);
              }
              return;
            }
            case 'ExprStmt': {
              await evalExpr(stmt.expr, env);
              return;
            }
          }
        }

        async function assignTarget(target, val, env, line) {
          if (target.type === 'Ident') {
            assignVar(target.name, val, env);
          } else if (target.type === 'TupleExpr') {
            if (!Array.isArray(val) || val.length !== target.items.length) {
              throw new PyTutorError({
                title: 'Помилка розпакування значень (ValueError)',
                line,
                what: 'Кількість змінних зліва від «=» не збігається з кількістю значень справа.',
                fix: 'Наприклад: a, b = 1, 2 (однакова кількість змінних і значень).'
              });
            }
            for (let i = 0; i < target.items.length; i++) {
              await assignTarget(target.items[i], val[i], env, line);
            }
          } else if (target.type === 'Index') {
            const obj = await evalExpr(target.obj, env);
            const idx = await evalExpr(target.index, env);
            if (!Array.isArray(obj)) {
              throw new PyTutorError({
                title: 'Не можна змінити елемент за індексом (TypeError)',
                line,
                what: 'Змінювати елементи за індексом [...] можна лише у списках.',
                fix: 'Перевір, чи це список.'
              });
            }
            const realIdx = idx < 0 ? obj.length + idx : idx;
            if (realIdx < 0 || realIdx >= obj.length) {
              throw new PyTutorError({
                title: 'Індекс за межами списку (IndexError)',
                line,
                what: `У списку лише ${obj.length} елементів, а звернення до індексу ${idx}.`,
                fix: 'Пам’ятай, що нумерація в Python починається з 0.'
              });
            }
            obj[realIdx] = val;
          } else {
            throw new PyTutorError({
              title: 'Не можна присвоїти значення (SyntaxError)',
              line,
              what: 'Ліворуч від знака «=» має бути назва змінної, а не число чи вираз.',
              fix: 'Постав назву змінної ліворуч від «=», наприклад: x = 10.'
            });
          }
        }

        function evalBinary(op, a, b, line) {
          if (op === '+') {
            if (typeof a === 'number' && typeof b === 'number') return a + b;
            if (typeof a === 'string' && typeof b === 'string') return a + b;
            if (Array.isArray(a) && Array.isArray(b)) return [...a, ...b];
            if ((typeof a === 'string' && typeof b === 'number') || (typeof a === 'number' && typeof b === 'string')) {
              throw new PyTutorError({
                title: 'Не можна додавати текст і число (TypeError)',
                line,
                what: `Ти намагаєшся додати «${pyStr(a)}» і «${pyStr(b)}» знаком «+». У Python текст і число так не з’єднуються.`,
                fix: 'Перетвори число на текст через str(...), наприклад "Вік: " + str(13), або передай у print() через кому: print("Вік:", 13).'
              });
            }
            throw new PyTutorError({
              title: 'Несумісні типи для «+» (TypeError)',
              line,
              what: `Не можна застосувати «+» до ${pyStr(a)} та ${pyStr(b)}.`,
              fix: 'Переконайся, що обидва значення є числами або обидва є рядками.'
            });
          }
          if (op === '*') {
            if (typeof a === 'number' && typeof b === 'number') return a * b;
            if (typeof a === 'string' && typeof b === 'number') return a.repeat(Math.max(0, Math.trunc(b)));
            if (typeof a === 'number' && typeof b === 'string') return b.repeat(Math.max(0, Math.trunc(a)));
            if (Array.isArray(a) && typeof b === 'number') {
              const out = [];
              for (let i = 0; i < Math.trunc(b); i++) out.push(...a);
              return out;
            }
          }
          if (typeof a === 'boolean') a = a ? 1 : 0;
          if (typeof b === 'boolean') b = b ? 1 : 0;
          if (typeof a !== 'number' || typeof b !== 'number') {
            throw new PyTutorError({
              title: `Помилка операції «${op}» (TypeError)`,
              line,
              what: `Операція «${op}» працює з числами, а отримано «${pyStr(a)}» і «${pyStr(b)}».`,
              fix: 'Якщо значення прийшло з input(), перетвори його у число: int(input()) або float(input()).'
            });
          }
          if (op === '-') return a - b;
          if (op === '**') return Math.pow(a, b);
          if (op === '/' || op === '//' || op === '%') {
            if (b === 0) {
              throw new PyTutorError({
                title: 'Ділення на нуль (ZeroDivisionError)',
                line,
                what: `Спроба виконати ділення «${op}» на 0. У математиці та Python ділити на нуль заборонено!`,
                fix: 'Перевір дільник (число або змінну праворуч від знака ділення) — він не має дорівнювати 0.'
              });
            }
            if (op === '/') return a / b;
            if (op === '//') return Math.floor(a / b);
            if (op === '%') return ((a % b) + b) % b;
          }
          return 0;
        }

        async function evalExpr(expr, env) {
          switch (expr.type) {
            case 'Literal':
              return expr.value;
            case 'FString': {
              // Evaluate `{expr}` interpolations inside f-string
              let result = '';
              let i = 0;
              const tpl = expr.template;
              while (i < tpl.length) {
                if (tpl[i] === '{') {
                  if (tpl[i + 1] === '{') { result += '{'; i += 2; continue; }
                  const closeIdx = tpl.indexOf('}', i + 1);
                  if (closeIdx === -1) {
                    throw new PyTutorError({
                      title: 'Помилка у f-рядку (SyntaxError)',
                      line: expr.line,
                      what: 'В f-рядку відкрито фігурну дужку «{», але не закрито «}».',
                      fix: 'Закрий дужку «}» після імені змінної або виразу.'
                    });
                  }
                  const subCode = tpl.slice(i + 1, closeIdx);
                  const subAst = parse(tokenize(subCode), [subCode]);
                  if (subAst.body.length > 0 && subAst.body[0].expr) {
                    result += pyStr(await evalExpr(subAst.body[0].expr, env));
                  }
                  i = closeIdx + 1;
                } else if (tpl[i] === '}' && tpl[i + 1] === '}') {
                  result += '}';
                  i += 2;
                } else {
                  result += tpl[i];
                  i++;
                }
              }
              return result;
            }
            case 'Ident':
              return lookupVar(expr.name, env, expr.line);
            case 'ListExpr': {
              const arr = [];
              for (const it of expr.items) arr.push(await evalExpr(it, env));
              return arr;
            }
            case 'TupleExpr': {
              const arr = [];
              for (const it of expr.items) arr.push(await evalExpr(it, env));
              arr.__isTuple = true;
              return arr;
            }
            case 'UnaryOp': {
              const v = await evalExpr(expr.arg, env);
              if (expr.op === 'not') return !isTruthy(v);
              if (typeof v !== 'number') {
                throw new PyTutorError({
                  title: 'Помилка знака перед значенням (TypeError)',
                  line: expr.line,
                  what: `Знак «${expr.op}» можна ставити лише перед числом.`,
                  fix: 'Перевір тип змінної.'
                });
              }
              return expr.op === '-' ? -v : +v;
            }
            case 'BinOp': {
              const l = await evalExpr(expr.left, env);
              const r = await evalExpr(expr.right, env);
              return evalBinary(expr.op, l, r, expr.line);
            }
            case 'BoolOp': {
              const l = await evalExpr(expr.left, env);
              if (expr.op === 'and') return isTruthy(l) ? await evalExpr(expr.right, env) : l;
              return isTruthy(l) ? l : await evalExpr(expr.right, env);
            }
            case 'Compare': {
              let cur = await evalExpr(expr.left, env);
              for (let i = 0; i < expr.ops.length; i++) {
                const op = expr.ops[i];
                const nxt = await evalExpr(expr.comparators[i], env);
                let ok = false;
                if (op === '==') ok = pyEquals(cur, nxt);
                else if (op === '!=') ok = !pyEquals(cur, nxt);
                else if (op === 'is') ok = cur === nxt;
                else if (op === 'is not') ok = cur !== nxt;
                else if (op === 'in' || op === 'not in') {
                  let found = false;
                  if (typeof nxt === 'string') found = nxt.includes(String(cur));
                  else if (Array.isArray(nxt)) found = nxt.some((x) => pyEquals(x, cur));
                  else {
                    throw new PyTutorError({
                      title: 'Помилка оператора «in» (TypeError)',
                      line: expr.line,
                      what: 'Праворуч від «in» має бути рядок або список.',
                      fix: 'Наприклад: "а" in "школа" або 3 in [1, 2, 3].'
                    });
                  }
                  ok = op === 'in' ? found : !found;
                } else {
                  if (typeof cur !== typeof nxt && !(typeof cur === 'number' && typeof nxt === 'number')) {
                    throw new PyTutorError({
                      title: 'Не можна порівняти різні типи (TypeError)',
                      line: expr.line,
                      what: `Ти порівнюєш «${pyStr(cur)}» і «${pyStr(nxt)}» знаком «${op}». Не можна порівнювати текст і число напряму!`,
                      fix: 'Перетвори текст з input() у число: int(input()) або float(input()).'
                    });
                  }
                  if (op === '<') ok = cur < nxt;
                  else if (op === '<=') ok = cur <= nxt;
                  else if (op === '>') ok = cur > nxt;
                  else if (op === '>=') ok = cur >= nxt;
                }
                if (!ok) return false;
                cur = nxt;
              }
              return true;
            }
            case 'Index': {
              const obj = await evalExpr(expr.obj, env);
              const idx = await evalExpr(expr.index, env);
              if (typeof obj !== 'string' && !Array.isArray(obj)) {
                throw new PyTutorError({
                  title: 'Помилка індексації (TypeError)',
                  line: expr.line,
                  what: 'Брати елемент у квадратних дужках [...] можна лише з тексту або списку.',
                  fix: 'Перевір тип змінної.'
                });
              }
              const realIdx = idx < 0 ? obj.length + idx : idx;
              if (realIdx < 0 || realIdx >= obj.length) {
                throw new PyTutorError({
                  title: 'Індекс виходить за межі (IndexError)',
                  line: expr.line,
                  what: `Довжина дорівнює ${obj.length}, тому елемента під номером ${idx} не існує.`,
                  fix: 'Пам’ятай: перший елемент має індекс 0, а останній — довжина мінус 1.'
                });
              }
              return obj[realIdx];
            }
            case 'Slice': {
              const obj = await evalExpr(expr.obj, env);
              const s = expr.start ? await evalExpr(expr.start, env) : undefined;
              const e = expr.end ? await evalExpr(expr.end, env) : undefined;
              return obj.slice(s, e);
            }
            case 'Attr': {
              const obj = await evalExpr(expr.obj, env);
              if (obj && obj.__pyModule) {
                const member = obj[expr.name];
                if (member === undefined) {
                  const suggestion = findClosestName(expr.name, Object.keys(obj).filter((k) => !k.startsWith('__')));
                  throw new PyTutorError({
                    title: `Невідома команда «${expr.name}» у модулі ${obj.__pyModule}`,
                    line: expr.line,
                    what: `У модулі ${obj.__pyModule} немає команди «${expr.name}».`,
                    fix: suggestion
                      ? `Можливо, ти мав на увазі «${obj.__pyModule}.${suggestion}»?`
                      : `Перевір написання назви команди після крапки.`
                  });
                }
                if (typeof member === 'function') {
                  return { __pyBuiltin: expr.name, fn: member };
                }
                return member;
              }
              if (Array.isArray(obj)) {
                if (expr.name === 'append') {
                  return { __pyBuiltin: 'append', fn: async (args) => { obj.push(args[0]); return null; } };
                }
                if (expr.name === 'pop') {
                  return { __pyBuiltin: 'pop', fn: async () => obj.pop() ?? null };
                }
              }
              if (typeof obj === 'string') {
                if (expr.name === 'lower') return { __pyBuiltin: 'lower', fn: async () => obj.toLowerCase() };
                if (expr.name === 'upper') return { __pyBuiltin: 'upper', fn: async () => obj.toUpperCase() };
                if (expr.name === 'strip') return { __pyBuiltin: 'strip', fn: async () => obj.trim() };
              }
              throw new PyTutorError({
                title: `Невідома властивість «${expr.name}» (AttributeError)`,
                line: expr.line,
                what: `У значення «${pyStr(obj)}» немає команди або властивості «${expr.name}».`,
                fix: 'Перевір назву після крапки.'
              });
            }
            case 'Call': {
              const callee = await evalExpr(expr.callee, env);
              const args = [];
              for (const a of expr.args) args.push(await evalExpr(a, env));
              const kw = {};
              for (const [k, v] of Object.entries(expr.kwargs)) kw[k] = await evalExpr(v, env);

              if (callee && callee.__pyBuiltin) {
                return await callee.fn(args, kw, expr.line);
              }
              if (callee && callee.__pyType === 'function') {
                const fnEnv = { vars: Object.create(null), globals: new Set(), parent: callee.closure };
                for (let i = 0; i < callee.params.length; i++) {
                  const p = callee.params[i];
                  if (i < args.length) {
                    fnEnv.vars[p.name] = args[i];
                  } else if (Object.prototype.hasOwnProperty.call(kw, p.name)) {
                    fnEnv.vars[p.name] = kw[p.name];
                  } else if (p.defaultVal) {
                    fnEnv.vars[p.name] = await evalExpr(p.defaultVal, callee.closure);
                  } else {
                    throw new PyTutorError({
                      title: `Не вистачає аргументів для ${callee.name}() (TypeError)`,
                      line: expr.line,
                      what: `Функція ${callee.name}() очікує параметр «${p.name}», але ти його не передав.`,
                      fix: `Передай потрібні значення в дужках, наприклад: ${callee.name}(...).`
                    });
                  }
                }
                if (args.length > callee.params.length) {
                  throw new PyTutorError({
                    title: `Забагато аргументів для ${callee.name}() (TypeError)`,
                    line: expr.line,
                    what: `Функція ${callee.name}() приймає ${callee.params.length} параметрів, а передано ${args.length}.`,
                    fix: `Зменш кількість значень у дужках при виклику ${callee.name}().`
                  });
                }
                try {
                  await execBlock(callee.body, fnEnv);
                  return null;
                } catch (sig) {
                  if (sig instanceof ReturnSignal) return sig.value;
                  throw sig;
                }
              }
              throw new PyTutorError({
                title: 'Це не функція (TypeError)',
                line: expr.line,
                what: `Об’єкт «${pyStr(callee)}» не можна викликати як функцію з дужками ().`,
                fix: 'Перевір, чи не названа твоя змінна так само, як і функція.'
              });
            }
          }
          return null;
        }

        await execBlock(ast.body, globalEnv);
      }

      /* ============================================================
         RUNNER & UI ORCHESTRATION
         ============================================================ */
      let activeController = null;
      let pendingInputResolver = null;
      let hasAnyOutput = false;

      function clearOutputUI() {
        consoleOut.innerHTML = '';
        hasAnyOutput = false;
        errorCard.classList.remove('visible');
        inputBar.classList.remove('visible');
        turtleWrap.classList.remove('visible');
        turtleEngine.reset();
      }

      function showError(err, rawLines) {
        const lineNum = Math.max(1, Math.min(err.line || 1, rawLines.length));
        const snippet = rawLines[lineNum - 1] ?? '';
        errorTitle.textContent = err.title || 'Помилка у програмі';
        errorLineBadge.textContent = `Рядок ${lineNum}`;
        errorWhat.textContent = err.what;
        errorWhere.textContent = `Рядок ${lineNum}: ${snippet.trim() || '(порожній рядок)'}`;
        errorFix.textContent = 'Як виправити: ' + err.fix;
        errorCard.classList.add('visible');
        outputPane.scrollTop = 0;
      }

      function appendConsoleText(text, isEcho = false) {
        if (!hasAnyOutput) {
          consoleOut.textContent = '';
          hasAnyOutput = true;
        }
        const span = document.createElement('span');
        if (isEcho) span.className = 'console-input-echo';
        span.textContent = text;
        consoleOut.appendChild(span);
        outputPane.scrollTop = outputPane.scrollHeight;
      }

      function submitStdin() {
        if (!pendingInputResolver) return;
        const val = stdinInput.value;
        const resolve = pendingInputResolver;
        pendingInputResolver = null;
        inputBar.classList.remove('visible');
        appendConsoleText((inputPromptLabel.textContent ? inputPromptLabel.textContent + ' ' : '') + val + '\n', true);
        stdinInput.value = '';
        resolve(val);
      }

      stdinSubmit.addEventListener('click', submitStdin);
      stdinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitStdin();
        }
      });

      function stopExecution() {
        if (activeController) {
          activeController.abort();
        }
        if (pendingInputResolver) {
          const resolve = pendingInputResolver;
          pendingInputResolver = null;
          inputBar.classList.remove('visible');
          resolve('');
        }
      }

      async function runCode() {
        if (activeController) {
          stopExecution();
          return;
        }

        // If user is on full-screen Code tab, switch to Result so output is visible immediately
        if (appEl.getAttribute('data-view') === 'code') {
          setViewMode('result');
        }

        clearOutputUI();

        const source = editor.value;
        const rawLines = source.replace(/\r\n?/g, '\n').split('\n');

        if (!source.trim()) {
          consoleOut.innerHTML = '<span class="console-placeholder">Редактор порожній. Напиши код Python і натисни «Запустити».</span>';
          return;
        }

        const controller = new AbortController();
        activeController = controller;
        runBtn.classList.add('running');
        runBtn.textContent = '■ Стоп';

        const host = {
          writeOut(txt) {
            appendConsoleText(txt);
          },
          showTurtle() {
            if (!turtleWrap.classList.contains('visible')) {
              turtleWrap.classList.add('visible');
              requestAnimationFrame(() => turtleEngine.render());
            }
          },
          readInput(promptText) {
            return new Promise((resolve) => {
              pendingInputResolver = resolve;
              inputPromptLabel.textContent = promptText || 'Введи значення (input):';
              inputBar.classList.add('visible');
              stdinInput.value = '';
              setTimeout(() => stdinInput.focus(), 20);
            });
          }
        };

        try {
          const tokens = tokenize(source);
          const ast = parse(tokens, rawLines);
          await executeAst(ast, host, controller.signal);

          if (!hasAnyOutput && !turtleWrap.classList.contains('visible')) {
            consoleOut.innerHTML = '<span class="console-placeholder">Програму виконано успішно (виводу немає).</span>';
          }
        } catch (err) {
          if (err instanceof PyTutorError) {
            showError(err, rawLines);
          } else {
            showError(
              new PyTutorError({
                title: 'Непередбачена помилка',
                line: 1,
                what: err?.message || 'Сталася помилка під час виконання коду.',
                fix: 'Перевір синтаксис коду та спробуй ще раз.'
              }),
              rawLines
            );
          }
        } finally {
          activeController = null;
          pendingInputResolver = null;
          inputBar.classList.remove('visible');
          runBtn.classList.remove('running');
          runBtn.textContent = '▶ Запустити';
          if (turtleWrap.classList.contains('visible')) {
            turtleEngine.render();
          }
        }
      }

      runBtn.addEventListener('click', runCode);
    })();
  </script>
</body>
</html>
